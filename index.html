<!doctype html>
<html lang="es">
<head>
    <!-- =====================================================
         CONFIGURACIÓN GENERAL DEL DOCUMENTO
         ===================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Color utilizado por algunos navegadores móviles -->
    <meta name="theme-color"
          content="#183D2D">

    <!-- Descripción general del sitio -->
    <meta id="metaDescription"
          name="description"
          content="Invitación digital de cumpleaños de Kenia y Kerem">

    <!-- Título mostrado en la pestaña del navegador -->
    <title>Kenia & Kerem | Cumplimos 11</title>


    <!-- =====================================================
         FUENTES DE GOOGLE
         ===================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">


    <!-- =====================================================
         VISTA PREVIA AL COMPARTIR

         Open Graph permite que WhatsApp, Facebook y otras
         aplicaciones muestren una vista previa personalizada.

         IMPORTANTE:
         Estas direcciones apuntan directamente a GitHub Pages.
         ===================================================== -->

    <meta property="og:type"
          content="website">

    <meta property="og:title"
          content="Kenia & Kerem | Cumplimos 11">

    <meta property="og:description"
          content="¡Acompáñanos a celebrar nuestros 11 años en una aventura inolvidable!">

    <!-- URL oficial de la invitación -->
    <meta property="og:url"
          content="https://dms-data-server.github.io/invitacion_cumplea-os_kenia_kerem/">


    <!-- =====================================================
         IMAGEN DE VISTA PREVIA

         Tamaño recomendado:
         1200 x 630 px

         Esta imagen es independiente del HERO principal.
         ===================================================== -->

    <meta property="og:image"
          content="https://dms-data-server.github.io/invitacion_cumplea-os_kenia_kerem/assets/images/share-preview.jpg?v=2">

    <meta property="og:image:secure_url"
          content="https://dms-data-server.github.io/invitacion_cumplea-os_kenia_kerem/assets/images/share-preview.jpg?v=2">

    <meta property="og:image:type"
          content="image/jpeg">

    <meta property="og:image:width"
          content="1200">

    <meta property="og:image:height"
          content="630">

    <meta property="og:image:alt"
          content="Invitación de cumpleaños de Kenia y Kerem">

    <meta property="og:site_name"
          content="StudioICrea">


    <!-- =====================================================
         VISTA PREVIA PARA OTRAS PLATAFORMAS
         ===================================================== -->

    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="Kenia & Kerem | Cumplimos 11">

    <meta name="twitter:description"
          content="¡Acompáñanos a celebrar nuestros 11 años en una aventura inolvidable!">

    <meta name="twitter:image"
          content="https://dms-data-server.github.io/invitacion_cumplea-os_kenia_kerem/assets/images/share-preview.jpg?v=2">


    <!-- =====================================================
         ICONOS DEL SITIO
         ===================================================== -->
    <!-- Icono general del navegador -->
    <link rel="icon"
          type="image/png"
          sizes="32x32"
          href="assets/images/favicon-32.png">

    <!-- Android / accesos directos -->
    <link rel="icon"
          type="image/png"
          sizes="192x192"
          href="assets/images/favicon-192.png">

    <!-- iPhone / iPad -->
    <link rel="apple-touch-icon"
          sizes="180x180"
          href="assets/images/apple-touch-icon.png">


    <!-- =====================================================
         HOJAS DE ESTILOS
         ===================================================== -->

    <link rel="stylesheet"
          href="css/styles.css">

    <link rel="stylesheet"
          href="css/animations.css">

    <link rel="stylesheet"
          href="css/responsive.css">

</head>
<body>
  <!-- Iconos SVG reutilizables: nítidos y sin dependencias externas. -->
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-calendar" viewBox="0 0 24 24"><path d="M7 2v3M17 2v3M3.5 9h17M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M7 13h2M11 13h2M15 13h2M7 17h2M11 17h2"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="icon-whatsapp" viewBox="0 0 24 24"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.5L3 20.5l1.3-4.7A8.5 8.5 0 1 1 20.5 11.7Z"/><path d="M8.1 7.6c.2-.5.4-.5.8-.5h.5c.2 0 .4.1.5.4l.8 1.8c.1.3.1.5-.1.7l-.6.8c-.2.2-.1.4 0 .6.8 1.4 1.9 2.5 3.4 3.2.2.1.4.1.6-.1l.8-1c.2-.2.4-.3.7-.2l1.8.9c.3.1.4.3.4.5 0 .4-.2 1.2-.7 1.7-.6.6-1.5.9-2.4.7-1.3-.2-3.2-1-5.1-2.7-1.5-1.4-2.6-3.1-3-4.4-.4-1.2 0-2 .4-2.4.3-.3.7-.5 1.2-.5Z"/></symbol>
    <symbol id="icon-maps" viewBox="0 0 24 24"><path d="M12 22s7-7.2 7-13A7 7 0 1 0 5 9c0 5.8 7 13 7 13Z"/><circle cx="12" cy="9" r="2.5"/></symbol>
    <symbol id="icon-gift" viewBox="0 0 24 24"><path d="M3 10h18v11H3zM2 6h20v4H2zM12 6v15"/><path d="M12 6H8.5A2.5 2.5 0 1 1 11 3.5L12 6Zm0 0h3.5A2.5 2.5 0 1 0 13 3.5L12 6Z"/></symbol>
    <symbol id="icon-volume" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4Z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="icon-muted" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4Z"/><path d="m17 10 4 4m0-4-4 4"/></symbol>
  </svg>

  <main id="invitation" class="invitation">
    <!-- HERO: la imagen es decorativa; todos los textos permanecen en HTML/config. -->
    <section id="module-hero" class="hero module">
      <div class="hero__shade"></div>
      <div class="hero__content reveal">
        <!-- Todo el contenido del HERO se carga desde config.js -->
        <p id="hero-kicker" class="hero__kicker"></p>

        <h1 id="event-names" class="hero__title"></h1>

        <div class="hero__age-banner">
          <span>¡CUMPLIMOS <strong id="event-age"></strong> AÑOS!</span>
        </div>

        <!-- La fecha se genera automáticamente a partir de event.date -->
        <div id="hero-date" class="hero__date"></div>

        <p id="hero-phrase" class="hero__phrase"></p>
      </div>
      <a class="scroll-cue" href="#module-event" aria-label="Ver detalles">⌄</a>
    </section>

    <section id="module-event" class="paper module reveal">
      <p class="eyebrow">DETALLES DE LA MISIÓN</p>
      <div class="details-grid">
        <article class="detail"><span class="detail__icon"><svg><use href="#icon-calendar"></use></svg></span><span class="detail__label">FECHA</span><strong id="event-date"></strong></article>
        <article class="detail"><span class="detail__icon"><svg><use href="#icon-clock"></use></svg></span><span class="detail__label">HORA</span><strong id="event-time"></strong></article>
        <article class="detail"><span class="detail__icon"><svg><use href="#icon-pin"></use></svg></span><span class="detail__label">LUGAR</span><strong id="event-place"></strong></article>
      </div>
    </section>

    <section id="module-recommendations" class="recommendation module reveal">
      <span class="recommendation__icon">≋</span>
      <p id="recommendation-text"></p>
    </section>

    <section id="module-actions" class="actions module reveal">
      <a id="btn-whatsapp" class="action action--whatsapp" href="#" target="_blank" rel="noopener">
        <span class="action__icon"><svg><use href="#icon-whatsapp"></use></svg></span><span><strong>CONFIRMAR ASISTENCIA</strong><small>POR WHATSAPP</small></span>
      </a>
      <a id="btn-location" class="action action--maps" href="#" target="_blank" rel="noopener">
        <span class="action__icon"><svg><use href="#icon-maps"></use></svg></span><span><strong>VER UBICACIÓN</strong><small>EN GOOGLE MAPS</small></span>
      </a>
    </section>

    <section id="module-gifts" class="paper gifts module reveal">
      <div class="gift-icon"><svg><use href="#icon-gift"></use></svg></div>
      <div><h2 id="gifts-title"></h2><p id="gifts-text"></p></div>
    </section>

    <p></p>

    <section id="module-closing" class="closing module">
      <div class="closing__shade"></div>
      <div class="closing__content reveal">
        <p id="closing-text" class="closing__title"></p>
        <span class="heart">♥</span>
        <small>Invitación digital creada por <strong>StudioICrea</strong></small>
      </div>
    </section>
  </main>

  <!-- Control flotante del módulo opcional de música. -->
  <button id="music-control" class="music-control" type="button" aria-label="Pausar música" hidden>
    <svg class="music-icon music-icon--on"><use href="#icon-volume"></use></svg>
    <svg class="music-icon music-icon--off"><use href="#icon-muted"></use></svg>
  </button>

  <script src="js/config.js"></script>
  <script src="js/modules/event-details.js"></script>
  <script src="js/modules/recommendations.js"></script>
  <script src="js/modules/whatsapp.js"></script>
  <script src="js/modules/location.js"></script>
  <script src="js/modules/gifts.js"></script>
  <script src="js/modules/music.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
